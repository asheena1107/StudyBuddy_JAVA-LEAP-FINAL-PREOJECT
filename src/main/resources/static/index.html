<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBuddy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>StudyBuddy</h1><p>Study Group Management System</p></header>

<main>
<section class="card">
<h2>Add Student</h2>
<form id="studentForm">
<input id="studentName" placeholder="Student name" required>
<input id="studentEmail" type="email" placeholder="Email" required>
<input id="studentDepartment" placeholder="Department" required>
<button type="submit">Add Student</button>
</form>
<p id="studentMsg" class="msg"></p>
</section>

<section class="card">
<h2>Add Subject</h2>
<form id="subjectForm">
<input id="subjectName" placeholder="Subject name" required>
<button type="submit">Add Subject</button>
</form>
<p id="subjectMsg" class="msg"></p>
</section>

<section class="card">
<h2>Create Study Group</h2>
<form id="groupForm">
<input id="groupName" placeholder="Group name" required>
<input id="groupDescription" placeholder="Description" required>
<input id="groupCapacity" type="number" min="1" placeholder="Capacity" required>
<input id="groupSubjectId" type="number" min="1" placeholder="Subject ID" required>
<button type="submit">Create Group</button>
</form>
<p id="groupMsg" class="msg"></p>
</section>

<section class="card">
<h2>Join Group</h2>
<form id="joinForm">
<input id="joinStudentId" type="number" min="1" placeholder="Student ID" required>
<input id="joinGroupId" type="number" min="1" placeholder="Group ID" required>
<button type="submit">Join</button>
</form>
<p id="joinMsg" class="msg"></p>
</section>

<section class="card">
<h2>Current Data</h2>
<button onclick="loadAll()">Refresh</button>
<div id="output"></div>
</section>
</main>

<script src="app.js"></script>
</body>
</html>
